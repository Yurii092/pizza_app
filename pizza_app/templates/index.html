<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Піца – Замовлення</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h1>🍕 Dominozo Pizza Service. Піца до столу!</h1>
        <nav>
            <a href="{{ url_for('view_cart') }}">🛒 Кошик ({{ cart_count }})</a>
        </nav>
    </header>

    <main>
        <h2>Меню піц</h2>
        <div class="menu">
            {% for item in menu %}
            <div class="menu-item">
                <span class="icon">{{ item.icon }}</span>
                <h3>{{ item.name }}</h3>
                <p>{{ item.price }} грн</p>
                <a href="{{ url_for('add_to_cart', item_name=item.name) }}">Додати в кошик</a>
            </div>
            {% endfor %}
        </div>
    </main>
</body>
</html>
